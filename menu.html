<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - StandSignals</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header class="section-header">
            <h2>CARTA</h2>
            <h1>Algunos favoritos de la barra</h1>
        </header>

        <!-- Formulario de Dashboard con restricción obligatoria a .png -->
        <section id="admin-upload-section" class="upload-section">
            <form id="productForm">
                <div class="form-group">
                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                
                <div class="form-group">
                    <label for="precio">Precio (RD$)</label>
                    <input type="number" step="0.01" id="precio" name="precio" required>
                </div>

                <div class="form-group">
                    <label for="imagenProducto">Imagen del producto (Obligatorio .PNG con fondo transparente)</label>
                    <input type="file" id="imagenProducto" name="imagenProducto" accept="image/png, .png" required>
                </div>

                <button type="submit" class="submit-btn">Guardar producto</button>
            </form>
        </section>

        <!-- Grid de productos -->
        <div id="menu-grid" class="menu-grid"></div>
    </main>

    <script src="js/supabase-client.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
